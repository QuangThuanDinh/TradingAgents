name: Publish private CLI image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, such as v0.7.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: private-cli-publication
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)", tag)
          version = re.search(r'^__version__ = "([^"]+)"', pathlib.Path("tradingagents/__init__.py").read_text(), re.M).group(1)
          if not match or match.group(1) != version:
              raise SystemExit("Release tag must match tradingagents.__version__.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - name: Install declared runtime and test dependencies
        run: python -m pip install ".[dev]"
      - name: Offline tests and lint
        run: |
          python -m pytest -q
          python -m ruff check .

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Define image and refuse a non-private existing package
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/$owner/tradingagents" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if gh api "users/$GITHUB_REPOSITORY_OWNER/packages/container/tradingagents" --jq .visibility > "$RUNNER_TEMP/cli-visibility.txt" 2> "$RUNNER_TEMP/cli-package-error.txt"; then
            test "$(cat "$RUNNER_TEMP/cli-visibility.txt")" = private || { echo "::error::Existing CLI package is not private; refusing publication."; exit 1; }
          else
            # GHCR creates a new package as private, including from public repositories.
            grep -q '(HTTP 404)' "$RUNNER_TEMP/cli-package-error.txt" || { cat "$RUNNER_TEMP/cli-package-error.txt"; exit 1; }
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build existing CLI Dockerfile for Linux AMD64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.VERSION }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
      - name: Smoke check installed CLI without networking or model APIs
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker run --rm --network none "$IMAGE:$VERSION" --help >/dev/null
          docker run --rm --network none -e CLI_EXPECTED_VERSION="$VERSION" --entrypoint python "$IMAGE:$VERSION" -c '
          import os
          from importlib.metadata import version
          import cli.main
          from tradingagents.default_config import build_default_config
          assert version("tradingagents") == os.environ["CLI_EXPECTED_VERSION"]
          config = build_default_config()
          assert config["report_length"] == "standard"
          assert config["tool_vendors"]["get_news"] == "alpha_vantage,yfinance"
          assert config["tool_vendors"]["get_global_news"] == "alpha_vantage,yfinance"
          print("Installed CLI version, imports and news defaults verified.")
          '
          for length in concise standard comprehensive; do
            docker run --rm --network none -e TRADINGAGENTS_REPORT_LENGTH="$length" --entrypoint python "$IMAGE:$VERSION" -c '
          import os
          from tradingagents.default_config import DEFAULT_CONFIG
          assert DEFAULT_CONFIG["report_length"] == os.environ["TRADINGAGENTS_REPORT_LENGTH"]
          '
          done
      - name: Publish version, verify privacy and update latest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE:$VERSION"
          verified=false
          for attempt in 1 2 3 4 5 6; do
            if visibility=$(gh api "users/$GITHUB_REPOSITORY_OWNER/packages/container/tradingagents" --jq .visibility 2> "$RUNNER_TEMP/cli-package-error.txt"); then
              test "$visibility" = private || { echo "::error::CLI package is not private."; exit 1; }
              verified=true
              break
            fi
            grep -q '(HTTP 404)' "$RUNNER_TEMP/cli-package-error.txt" || { cat "$RUNNER_TEMP/cli-package-error.txt"; exit 1; }
            sleep 5
          done
          test "$verified" = true || { echo "::error::Could not verify package privacy."; exit 1; }
          docker push "$IMAGE:latest"
